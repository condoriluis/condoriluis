name: Profile Summary Cards

on:
  schedule:
    # Corre todos los días a las 06:00 UTC (02:00 hora de La Paz)
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate profile summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: condoriluis
          THEME: tokyonight
          # UTC offset de Bolivia (UTC-4) para el gráfico de horario productivo
          UTC_OFFSET: -4
